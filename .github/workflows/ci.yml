name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Day-bucketed quotas/usage have bitten us on non-UTC hosts; run
        # both sides of the date line.
        tz: [UTC, America/Chicago, Pacific/Auckland]
    env:
      TZ: ${{ matrix.tz }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          out=$(gofmt -l ./cmd ./internal)
          if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi

      - name: vet
        run: go vet ./...

      - name: test
        run: go test -race -count=1 ./...
