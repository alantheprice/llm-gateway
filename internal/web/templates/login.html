<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — LLM Gateway</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<link rel="stylesheet" href="/static/app.css">
</head>
<body class="auth">
  <div class="auth-card">
    <h1><span class="brand-mark"><svg class="brand-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M5.4 22V10.6a6.6 6.6 0 0 1 13.2 0V22" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/><path d="M13.5 8.2 8.8 15h3.4l-1.3 6.4 5.2-7.8h-3.4z" fill="currentColor" stroke="currentColor" stroke-width="0.5" stroke-linejoin="round"/></svg></span> LLM Gateway</h1>
    <p class="sub">Sign in to chat and manage your API keys.</p>
    <form method="post" action="/login">
      <label for="username">Username</label>
      <input id="username" name="username" autofocus autocomplete="username" required>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button>Sign in</button>
      {{if .Error}}<div class="auth-error">{{.Error}}</div>{{end}}
    </form>
    <p class="sub" style="margin:16px 0 0">Accounts are issued by invitation. New here? <a href="/guide">Read the setup guide</a>.</p>
  </div>
</body>
</html>
