<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — LLM Gateway</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<link rel="stylesheet" href="/static/app.css">
</head>
<body class="auth">
  <div class="auth-card">
    <h1><span class="brand-mark"><svg class="brand-svg" viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><path fill-rule="evenodd" d="M4 21.4V10.6a8 8 0 0 1 16 0v10.8z M14.2 5.2 7.2 14.6h4.4l-1.4 5.8 6.8-9.2h-4.4z"/></svg></span> LLM Gateway</h1>
    <p class="sub">Sign in to chat and manage your API keys.</p>
    <form method="post" action="/login">
      <label>Username</label>
      <input name="username" autofocus autocomplete="username" required>
      <label>Password</label>
      <input name="password" type="password" autocomplete="current-password" required>
      <button>Sign in</button>
      {{if .Error}}<div class="auth-error">{{.Error}}</div>{{end}}
    </form>
    <p class="sub" style="margin:16px 0 0">Accounts are issued by invitation.</p>
  </div>
<p style="text-align:center;margin-top:1rem;font-size:13px"><a href="/guide" style="color:var(--muted,#8b949e)">New here? Read the setup guide</a></p></body>
</html>
